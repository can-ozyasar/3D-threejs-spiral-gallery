    <g transform="translate(96 980)">
      <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="850" fill="#ffffff">10 buyer personas</text>
      <g transform="translate(0 34)">
        <circle cx="31" cy="31" r="31" fill="#31d4ff"/>
        <circle cx="111" cy="31" r="31" fill="#8ef36f"/>
        <circle cx="191" cy="31" r="31" fill="#ffd166"/>
        <circle cx="271" cy="31" r="31" fill="#ff6b6b"/>
        <circle cx="351" cy="31" r="31" fill="#b48cff"/>
        <circle cx="431" cy="31" r="31" fill="#f7fbff"/>
        <circle cx="511" cy="31" r="31" fill="#34d399"/>
        <circle cx="591" cy="31" r="31" fill="#60a5fa"/>
        <circle cx="671" cy="31" r="31" fill="#fb7185"/>
        <circle cx="751" cy="31" r="31" fill="#facc15"/>
      </g>
    </g>

    <g transform="translate(96 1126)">
      <rect x="0" y="0" width="820" height="86" rx="28" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".14"/>
      <path d="M48 43 H766" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="48" cy="43" r="12" fill="#31d4ff"/>
      <circle cx="290" cy="43" r="12" fill="#8ef36f"/>
      <circle cx="532" cy="43" r="12" fill="#ffd166"/>
      <circle cx="766" cy="43" r="12" fill="#ffffff"/>
