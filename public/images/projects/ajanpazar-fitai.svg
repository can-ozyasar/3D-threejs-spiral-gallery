          <text x="24" y="34" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Trust</text>
          <text x="24" y="66" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="900" fill="#31d4ff">92</text>
          <rect x="200" y="0" width="176" height="86" rx="22" fill="#111c2e" stroke="#ffd166" stroke-opacity=".38"/>
          <text x="224" y="34" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Return Risk</text>
          <text x="224" y="66" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="900" fill="#ffd166">Low</text>
        </g>

        <g transform="translate(0 304)">
          <rect x="0" y="0" width="376" height="78" rx="22" fill="#0f2a1e" stroke="#8ef36f" stroke-opacity=".32"/>
          <text x="24" y="31" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#dfffe4">Ready fix package</text>
          <text x="24" y="58" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#9fb2c7">FAQ, SEO brief, product passport</text>
        </g>
      </g>
