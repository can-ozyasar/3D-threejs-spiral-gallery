<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">AjanPazar x FitAI project cover</title>
  <desc id="desc">AI commerce analysis dashboard with buyer personas, product readiness score and shopping agent signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset=".48" stop-color="#101525"/>
      <stop offset="1" stop-color="#03170f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033" stop-opacity=".94"/>
      <stop offset="1" stop-color="#071014" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31d4ff"/>
      <stop offset=".52" stop-color="#8ef36f"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".15" cy=".1" r=".65">
      <stop offset="0" stop-color="#2ed3ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#2ed3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".9" cy=".25" r=".7">
      <stop offset="0" stop-color="#90ff7a" stop-opacity=".38"/>
      <stop offset="1" stop-color="#90ff7a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000000" flood-opacity=".42"/>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0v72" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg)"/>
  <rect width="1200" height="1500" fill="url(#glowA)"/>
  <rect width="1200" height="1500" fill="url(#glowB)"/>
  <rect width="1200" height="1500" fill="url(#grid)"/>

  <g opacity=".72">
    <path d="M80 1230 C280 1080 420 1180 600 1040 S960 900 1130 1000" fill="none" stroke="#31d4ff" stroke-opacity=".25" stroke-width="2"/>
    <path d="M70 1290 C260 1125 440 1240 610 1110 S960 970 1135 1060" fill="none" stroke="#8ef36f" stroke-opacity=".22" stroke-width="2"/>
  </g>

  <g transform="translate(88 108)">
    <rect x="0" y="0" width="1024" height="1284" rx="44" fill="#05080d" fill-opacity=".48" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="30" y="32" width="964" height="1220" rx="34" fill="url(#panel)" filter="url(#softShadow)"/>

    <g transform="translate(78 80)">
      <rect x="0" y="0" width="218" height="42" rx="21" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".18"/>
      <circle cx="26" cy="21" r="7" fill="#8ef36f"/>
      <text x="48" y="28" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#dff7ff" letter-spacing="2">BTK 2026</text>

      <text x="0" y="126" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="900" fill="#ffffff" letter-spacing="-2">AjanPazar</text>
      <text x="0" y="192" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800" fill="#d7ffe0" letter-spacing="-1">x FitAI</text>
      <text x="0" y="250" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600" fill="#b8c7d8">AI agent commerce intelligence</text>
    </g>

    <g transform="translate(78 402)">
