        <text x="0" y="26" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#ffffff">Agent Readiness</text>
        <text x="0" y="78" font-family="Inter, Arial, sans-serif" font-size="82" font-weight="900" fill="#8ef36f">87</text>
        <text x="116" y="78" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800" fill="#8394a8">/100</text>
        <rect x="0" y="116" width="376" height="18" rx="9" fill="#263246"/>
        <rect x="0" y="116" width="327" height="18" rx="9" fill="url(#accent)"/>

