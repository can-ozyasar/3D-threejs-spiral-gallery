      <rect x="38" y="42" width="330" height="430" rx="28" fill="#f7fbff"/>
      <rect x="66" y="74" width="274" height="242" rx="22" fill="#dce8f3"/>
      <path d="M92 286 L174 192 L226 254 L262 214 L322 286 Z" fill="#99aec2"/>
