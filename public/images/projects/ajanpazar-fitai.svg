      <rect x="68" y="346" width="230" height="16" rx="8" fill="#223047" opacity=".95"/>
      <rect x="68" y="380" width="184" height="13" rx="7" fill="#5d718d" opacity=".75"/>
      <rect x="68" y="414" width="128" height="13" rx="7" fill="#5d718d" opacity=".55"/>

