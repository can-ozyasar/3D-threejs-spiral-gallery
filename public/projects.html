<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Projects — Muhammed Can Özyaşar</title>
  <meta name="description" content="Muhammed Can Özyaşar'ın proje detay sayfası — yapay zeka, RAG ve backend mühendisliği projelerinden birine ait genişletilmiş bilgiler."/>
  <!-- id parametresi olmadan bu şablon "not found" gösterir ve hiçbir yerden
       linklenmiyor — arama sonuçlarında boş sayfa görünmesin diye noindex. -->
  <meta name="robots" content="noindex, follow"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <script>document.documentElement.classList.add('theme-light')</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/src/styles.css"/>
  <link rel="stylesheet" href="/src/overrides.css"/>
  <style>
    :root{--bg:#f7f8f6;--bg2:#eef1ee;--fg:#1a2733;--fg2:#5b6b77;--accent:#2547c0;--rule:rgba(26,39,51,0.14);--serif:'Bricolage Grotesque',system-ui,sans-serif;--sans:'Atkinson Hyperlegible',sans-serif;--mono:'IBM Plex Mono',monospace}
    html.light{}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--fg);font-family:var(--sans);min-height:100vh}
    /* Hero */
    .proj-hero{position:relative;min-height:55vh;display:flex;align-items:flex-end;padding:80px 40px 60px;overflow:hidden;margin-top:0}
    .proj-hero__bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.35) saturate(.5)}
    .proj-hero__overlay{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 0%,rgba(247,248,246,.75) 60%,rgba(247,248,246,.2) 100%)}
    
    .proj-hero__content{position:relative;z-index:2;max-width:900px}
    .proj-badge{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:4px 12px;border-radius:2px;margin-bottom:20px}
    .proj-hero h1{font-family:var(--serif);font-size:clamp(2.2rem,5vw,4rem);font-weight:500;line-height:1.1;margin-bottom:16px}
    .proj-hero p.abstract{font-size:16px;line-height:1.8;color:var(--fg2);max-width:680px}

    /* Body */
    main{max-width:900px;margin:0 auto;padding:60px 40px 100px}
    .proj-section{margin-bottom:60px}
    .proj-section h2{font-family:var(--serif);font-size:1.6rem;margin-bottom:24px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
    .proj-section p{font-size:15px;line-height:1.9;color:var(--fg2);margin-bottom:14px}
    .proj-section ul{padding-left:20px;color:var(--fg2);font-size:15px;line-height:2}
    .proj-section ul li{margin-bottom:8px}
    .stack-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
    .stack-tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:6px 14px;border:1px solid var(--rule);border-radius:2px;color:var(--accent)}
    .links-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:24px}
    .link-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;font-size:13px;font-family:var(--mono);letter-spacing:.08em;text-decoration:none;border-radius:2px;transition:all .2s}
    .link-btn--primary{background:var(--accent);color:var(--bg)}
    .link-btn--primary:hover{opacity:.85}
    .link-btn--ghost{border:1px solid var(--rule);color:var(--fg2)}
    .link-btn--ghost:hover{border-color:var(--accent);color:var(--accent)}
    .back-btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--fg2);text-decoration:none;margin-bottom:40px;transition:color .2s}
    .back-btn:hover{color:var(--accent)}
    .metric-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:20px;margin:24px 0}
    .metric{padding:20px;border:1px solid var(--rule);border-radius:4px;text-align:center}
    .metric__val{font-family:var(--serif);font-size:2rem;color:var(--accent);display:block}
    .metric__label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg2);margin-top:4px;display:block}
    #proj-not-found{text-align:center;padding:120px 40px;font-family:var(--serif);font-size:1.5rem;color:var(--fg2)}
    @media(max-width:600px){main{padding:40px 20px 80px}.proj-hero{padding:80px 20px 40px}}
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="nav">
    <a href="/#hero" class="nav__brand" aria-label="Ana sayfa">
      <span class="nav__mark" aria-hidden="true"></span>
      <span>Canoz</span>
    </a>
    <nav class="nav__links" aria-label="Ana menü">
      <a href="/#hakkimda" data-en="About">Hakkımda</a>
      <a href="/#beceriler" data-en="Skills">Beceriler</a>
      <a href="/#projeler" data-en="Projects">Projeler</a>
      <a href="/#deneyim" data-en="Experience">Deneyim</a>
      <a href="/#makaleler" data-en="Articles">Makaleler</a>
      <a href="/blog.html" data-en="Blog">Blog</a>
      <a href="/hr.html" class="nav__hr" data-en="HR Mode">HR Modu</a>
      <a href="/#referanslar" data-en="References">Referanslar</a>
      <a href="/#iletisim" data-en="Contact">İletişim</a>
    </nav>
    <div class="nav__toggles">
      <button id="lang-toggle" aria-label="Dili değiştir">EN</button>
      <button id="theme-toggle" type="button" aria-label="Açık temaya geç"></button>
    </div>
  </header>

  <div id="proj-hero-wrap">
    <section class="proj-hero" id="proj-hero">
      <div class="proj-hero__bg" id="proj-bg"></div>
      <div class="proj-hero__overlay"></div>
      <div class="proj-hero__content">
        <span class="proj-badge" id="proj-badge"></span>
        <h1 id="proj-title"></h1>
        <p class="abstract" id="proj-abstract"></p>
      </div>
    </section>
  </div>

  <main>
    <a href="/#projeler" class="back-btn">← All Projects</a>

    <div id="proj-body"></div>
    <div id="proj-not-found" style="display:none">Project not found. <a href="/" style="color:var(--accent)">Go home →</a></div>
  </main>

  <script>
  const PROJECTS = {
    federated: {
      badge:'TÜBİTAK 2209-A · Research',
      title:'Privacy-Preserving Federated Learning',
      bg:'/images/proj_federated.jpg'
    },
    teklifakis: {
      badge:'TÜBİTAK 1812 BIGG · Founder',
      title:'TeklifAkış — AI-Powered Bid Intelligence',
      bg:'/images/proj_teklifakis.jpg'
    },
    'ajanpazar-fitai': {
      badge:'BTK Hackathon 2026 · Multi-Agent Commerce',
      title:'AjanPazar × FitAI — Product Page Intelligence',
      bg:'/images/projects/ajanpazar-fitai.svg',
      abstract:'E-ticaret ürün sayfalarını 10 farklı alıcı kişiliği ve siteyi canlı gezen gerçek bir AI ajan üzerinden test eden BTK 2026 hackathon platformu. Sistem ürün satmaz; ürün sayfasının insan kullanıcıya, persona ajanlara ve gelecekte sipariş verecek AI alışveriş ajanlarına ne kadar hazır olduğunu ölçer.',
      metrics:[
        {val:'10',label:'Persona Agents'},
        {val:'1',label:'Live Agent'},
        {val:'8',label:'Score Areas'},
        {val:'2',label:'Applications'}
      ],
      sections:[
        {
          title:'Problem',
          body:'Ürün sayfalarında başlık, açıklama, görsel, ölçü, malzeme, garanti, kargo ve hedef kullanıcı bilgileri eksik olduğunda hem insan alıcı hem de AI alışveriş ajanı ürünü doğru anlayamaz. Gelecekte kullanıcılar ürünleri tek tek gezmek yerine ajanlara sipariş verdireceği için, ürün sayfasının ajan tarafından okunabilir, gezilebilir ve önerilebilir olması doğrudan satış sinyaline dönüşür.'
        },
        {
          title:'Ajan Yapısı',
          body:'Sistem 10 farklı kişilikte alıcı ajan çalıştırır: bütçe odaklı, kalite odaklı, hediye alan, kararsız kullanıcı, iade etmek istemeyen kullanıcı gibi profiller ürün sayfasını kendi motivasyonlarıyla değerlendirir. Buna ek olarak bir gerçek gezinme ajanı siteyi ajan modunda dolaşır; ürün bilgisine erişebiliyor mu, kritik detayları bulabiliyor mu ve sayfa AI alışveriş ajanı için yeterince anlaşılır mı sorularını canlı test eder.'
        },
        {
          title:'Skorlama ve Çıktılar',
          body:'AjanPazar satıcı tarafında Human Conversion, AI Agent Readiness, Recommendability, Trust, Return Risk, Missing Information Risk, Comparison Strength ve Clarity alanlarında analiz üretir. FitAI alıcı tarafında beden tavsiyesi, yorum özeti, iade senaryosu, kombin ve stil analizi sunar. Sonuçta ürün pasaportu, SSS, SEO açıklaması, AI ajanlara uygun yapılandırılmış özet ve hazır düzeltme paketi oluşur.'
        },
        {
          title:'Mimari',
          body:'Proje iki uygulamadan oluşur: Ana analiz platformu ve gerçekçi mock e-ticaret sitesi. Ana platform Next.js API routes üzerinden ürün verisini işler; Gemini API AjanPazar analizlerinde, Claude API FitAI kişisel değerlendirme akışlarında kullanılır. Mock mağaza ürün, yorum, satıcı, beden tablosu ve kullanıcı profili verileri sağlar; canlı gezinme ajanı da bu sayfalar üzerinde ajan-readiness testi yapar.'
        },
        {
          title:'Demo Değeri',
          body:'Jüri demosunda zayıf bir ürün sayfası analiz edilir; önce persona ajanların farklı itirazları ve gerçek gezinme ajanının bulduğu erişilebilirlik/anlaşılabilirlik problemleri gösterilir. Sistem düşük conversion, trust ve AI readiness skorlarını görünür kılar; ardından eksik bilgileri, iade risklerini ve ajanların ürünü neden önermeyebileceğini listeler. Hazır düzeltme paketiyle sayfa hem insan hem AI ajan için güçlendirilir.'
        }
      ],
      stack:['Next.js','TypeScript','Gemini API','Claude API','10 Persona Agents','Live Browsing Agent','AI Agent Readiness','Score Dashboard']
    },
    rag: {
      badge:'Production · Live System',
      title:'Secure RAG Portfolio Assistant',
      bg:'/images/proj_rag.jpg'
    },
    battery: {
      badge:'TÜBİTAK 2247-C STAR · Research',
      title:'Li-ion Battery SoH/SoC Prediction',
      bg:'/images/proj_battery.jpg'
    },
    bios: {
      badge:'Autonomous Intelligence · 2025',
      title:'BIOS Signal Radar — Industrial Intelligence',
      bg:'/images/pic/pic5.jpeg'
    },
    vocab: {
      badge:'.NET 8 · 2025',
      title:'Vocabulary Cards — SM-2 Spaced Repetition',
      bg:'/images/pic/pic7.jpeg'
    },
    hayalperest: {
      badge:'BTK Hackathon · GenAI · 2024',
      title:'Hayalperest Hikayeler — Generative AI',
      bg:'/images/pic/pic9.jpeg'
    },
    gym: {
      badge:'Full-Stack · 2024',
      title:'Gym Management System',
      bg:'/images/pic/pic11.jpeg'
    }
  };

  function render(){
    const id=new URLSearchParams(location.search).get('id');
    const p=PROJECTS[id];
    if(!p){document.getElementById('proj-not-found').style.display='block';document.getElementById('proj-hero-wrap').style.display='none';return;}
    document.title=p.title+' — Canoz';
    document.getElementById('proj-badge').textContent=p.badge;
    document.getElementById('proj-title').textContent=p.title;
    document.getElementById('proj-abstract').textContent=p.abstract || 'Bu proje detay sayfasını zamanla dolduracağım. Şimdilik başlık ve kategori yerinde duruyor; içerik alanları düzenli bir şablon olarak bırakıldı.';
    document.getElementById('proj-bg').style.backgroundImage=`url('${p.bg}')`;
    if(p.sections){
      const metrics=(p.metrics||[]).map(m=>`<div class="metric"><span class="metric__val">${m.val}</span><span class="metric__label">${m.label}</span></div>`).join('');
      const sections=p.sections.map(s=>`<div class="proj-section"><h2>${s.title}</h2><p>${s.body}</p></div>`).join('');
      const stack=(p.stack||[]).map(s=>`<span class="stack-tag">${s}</span>`).join('');
      document.getElementById('proj-body').innerHTML=`
        <div class="metric-row">${metrics}</div>
        ${sections}
        <div class="proj-section">
          <h2>Teknoloji Haritası</h2>
          <div class="stack-grid">${stack}</div>
        </div>`;
      return;
    }
    document.getElementById('proj-body').innerHTML=`
      <div class="metric-row">
        <div class="metric"><span class="metric__val">01</span><span class="metric__label">Problem</span></div>
        <div class="metric"><span class="metric__val">02</span><span class="metric__label">Architecture</span></div>
        <div class="metric"><span class="metric__val">03</span><span class="metric__label">Stack</span></div>
        <div class="metric"><span class="metric__val">04</span><span class="metric__label">Outcome</span></div>
      </div>
      <div class="proj-section">
        <h2>Durum</h2>
        <p>Bu proje sayfasının detaylarını daha sonra yazacağım. Şimdilik burası düzenli bir içerik şablonu olarak bırakıldı.</p>
      </div>
      <div class="proj-section">
        <h2>Yazılacak Bölümler</h2>
        <ul>
          <li>Projenin çözdüğü problem ve hedef kullanıcı.</li>
          <li>Kullandığım mimari yaklaşım ve teknik kararlar.</li>
          <li>Veri, model, backend veya ürün geliştirme süreci.</li>
          <li>Kullanılan teknolojiler ve neden seçildikleri.</li>
          <li>Varsa demo, GitHub bağlantısı, ekran görüntüleri ve sonuç metrikleri.</li>
          <li>Projeden öğrendiklerim ve sonraki geliştirme planı.</li>
        </ul>
      </div>
      <div class="proj-section">
        <h2>Not</h2>
        <p>Bu alanı zamanla gerçek proje çıktıları, teknik açıklamalar ve görsellerle dolduracağım.</p>
      </div>`;
  }



  render();
  </script>
  <script type="module" src="/src/i18n.js"></script>
  <script type="module" src="/src/theme.js"></script>
</body>
</html>
